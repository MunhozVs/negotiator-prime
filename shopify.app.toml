# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "794ef82dd66dce0a6efc612d928b9708"
name = "Negotiator Prime"
application_url = "https://primestyle.com/app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Products and collections power scoped rules; draft orders complete accepted negotiations.
scopes = "read_products,read_draft_orders,write_draft_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]

[app_proxy]
url = "https://primestyle.com/api"
subpath = "negotiator"
prefix = "apps"
